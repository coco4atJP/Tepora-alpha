<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tepora キャラクター探索ラボ</title>
<style>
/* Tokens copied from Tepora-v3/web/styles.css so the sketches sit on the same paper, ink and lamp. */
:root{
 --font-ui:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,system-ui,-apple-system,"Segoe UI",sans-serif;
 --font-display:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
 --font-num:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI","Helvetica Neue",system-ui,sans-serif;
 --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
 --radius:12px;--radius-lg:18px;
}
[data-theme=light]{
 color-scheme:light;
 --bg:#f3f0e9;--bg-2:#e9e4da;--surface:#faf8f3;--surface-2:#fffefb;
 --text:#23211d;--muted:#6a645b;--line:#e1dbd0;--line-strong:#cfc7ba;
 --accent:#23211d;--accent-soft:#e9e4da;--on-accent:#fffefb;
 --brand:#d4583a;--lamp-wait:#e2a12a;--attention:#84560c;--attention-soft:#f4e7cd;--ok:#36684d;
 --shadow-sm:0 1px 2px rgba(43,36,26,.07);--shadow:0 8px 26px rgba(43,36,26,.09);--shadow-lg:0 24px 64px rgba(43,36,26,.16);
 --pool-color:rgba(255,196,140,.45);--glow-1:rgba(255,172,104,.46);--glow-2:rgba(255,172,104,.14);
}
[data-theme=dark]{
 color-scheme:dark;
 --bg:#151412;--bg-2:#1d1b18;--surface:#1f1d1a;--surface-2:#272420;--text:#ece7de;--muted:#a69e91;--line:#34302a;--line-strong:#48423a;
 --accent:#ece7de;--accent-soft:#2b2823;--on-accent:#151412;--brand:#ef7a58;--lamp-wait:#e2a12a;
 --attention:#e8b860;--attention-soft:#372c18;--ok:#8ccaa4;
 --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow:0 10px 30px rgba(0,0,0,.35);--shadow-lg:0 24px 64px rgba(0,0,0,.5);
 --pool-color:rgba(214,98,64,.22);--glow-1:rgba(236,110,76,.34);--glow-2:rgba(214,98,64,.12);
}
[data-theme=lamp]{
 color-scheme:dark;
 --bg:#0e0c0a;--bg-2:#1b1814;--surface:#1a1714;--surface-2:#221e19;--text:#dccfb6;--muted:#8d8271;--line:#2b2621;--line-strong:#3d362d;
 --accent:#dccfb6;--accent-soft:#2a251f;--on-accent:#0e0c0a;--brand:#ef7a58;--lamp-wait:#e2a12a;
 --attention:#e8b860;--attention-soft:#372c18;--ok:#8ccaa4;
 --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow:0 10px 30px rgba(0,0,0,.35);--shadow-lg:0 24px 64px rgba(0,0,0,.5);
 --pool-color:rgba(214,98,64,.30);--glow-1:rgba(236,110,76,.46);--glow-2:rgba(214,98,64,.16);
}
/* The same names the shipped character CSS reads, so the baseline is the real drawing. */
html{}

/* ===== shared character layer: the mood table is the only thing the app has to say ===== */
.cx-host{display:block}
.cx{display:block;width:100%;height:auto;overflow:visible;
 --look-x:0px;--look-y:0px;--mouth:.95;
 --lift:0px;--lean:0deg;--sq:1;--glow:.24;--ant:0deg;--lid:0}
.cx[data-mood=listening]{--lift:-3px;--sq:1.025;--glow:.55;--ant:7deg;--lean:-1.5deg}
.cx[data-mood=thinking]{--glow:.65;--ant:-5deg}
.cx[data-mood=talking]{--glow:.5;--ant:3deg}
.cx[data-mood=happy]{--lift:-4px;--glow:.78;--ant:-8deg}
.cx[data-mood=attention]{--glow:.5;--ant:18deg}
.cx[data-mood=concerned]{--lift:2px;--glow:.1;--ant:-14deg}
.cx[data-mood=sleepy]{--lift:3px;--glow:.04;--ant:40deg}

.cx .floor{fill:var(--c-ink);opacity:.08}
.cx .lamp-dot{fill:var(--c-lamp);transition:opacity .4s}
.cx .lamp-glow{opacity:var(--glow);transition:opacity .5s}
.cx[data-mood=sleepy] .lamp-dot{opacity:.38}
[data-theme=dark] .cx .lamp-dot{filter:drop-shadow(0 0 4px rgba(var(--c-lamp-rgb),.8))}
[data-theme=lamp] .cx .lamp-dot{filter:drop-shadow(0 0 5px rgba(var(--c-lamp-rgb),.95)) drop-shadow(0 0 12px rgba(var(--c-lamp-rgb),.65))}
[data-theme=lamp] .cx .lamp-glow{opacity:calc(var(--glow) + .35)}

/* Ink marks beside the face (never colour): the vocabulary of manga, used sparingly. */
.cx .fx{opacity:0;transition:opacity .3s;pointer-events:none}
.cx .fx-spark path{fill:var(--c-ink);opacity:.62}
.cx .fx-sweat{fill:rgba(255,255,255,.78);stroke:var(--c-ink);stroke-opacity:.5;stroke-width:1.6}
.cx .fx-z text{font:700 17px var(--font-ui);fill:var(--muted)}
.cx .fx-z text:nth-child(2){font-size:13px}
.cx .fx-dots circle{fill:var(--muted)}
.cx[data-mood=happy] .fx-spark{opacity:1}
.cx[data-mood=happy] .fx-spark .sp{animation:cx-twinkle 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.cx[data-mood=happy] .fx-spark .sp2{animation-delay:.3s}.cx[data-mood=happy] .fx-spark .sp3{animation-delay:.6s}
.cx[data-mood=concerned] .fx-sweat{opacity:1}
.cx[data-mood=sleepy] .fx-z{opacity:1}
.cx[data-mood=sleepy] .fx-z text{animation:cx-z 3.4s ease-in-out infinite}
.cx[data-mood=sleepy] .fx-z text:nth-child(2){animation-delay:1.7s}
.cx[data-mood=thinking] .fx-dots{opacity:1}
.cx[data-mood=thinking] .fx-dots circle{animation:cx-dot 1.2s ease-in-out infinite}
.cx[data-mood=thinking] .fx-dots circle:nth-child(2){animation-delay:.2s}.cx[data-mood=thinking] .fx-dots circle:nth-child(3){animation-delay:.4s}
@keyframes cx-twinkle{0%,100%{transform:scale(.55) rotate(0);opacity:.2}50%{transform:scale(1.15) rotate(20deg);opacity:1}}
@keyframes cx-z{0%{opacity:0;transform:translate(0,6px)}35%{opacity:.85}100%{opacity:0;transform:translate(9px,-16px)}}
@keyframes cx-dot{0%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.cx .fx-dots circle{transform-box:fill-box;transform-origin:center}


/* ---- the standard face rig (shiro, andon, kitsune, kokedama share it) ---- */
.cx .cheek{fill:var(--c-cheek);opacity:.38}
.cx .eo rect,.cx .eo circle:not(.catch),.cx .eo ellipse,.cx .eo path{fill:var(--c-ink)}
.cx .catch{fill:#fff;opacity:.92}
.cx .eh path,.cx .ec path,.cx .smile,.cx .mouth-w,.cx .mouth-s,.cx .brow{fill:none;stroke:var(--c-ink);stroke-width:4;stroke-linecap:round}
.cx .brow{stroke-width:3;opacity:0;transition:opacity .2s,transform .35s cubic-bezier(.3,.7,.3,1)}
.cx .mouth{fill:#8a4535;transform-origin:100px 150px;transform:scaleY(.3)}
.cx .eh,.cx .ec,.cx .smile,.cx .mouth,.cx .mouth-w,.cx .mouth-s{opacity:0;transition:opacity .2s}
.cx .face{transform:translate(var(--look-x),var(--look-y));transition:transform .4s cubic-bezier(.3,.7,.3,1)}
.cx .eyes{transform-origin:100px 126px;transition:transform .06s}
.cx.is-blinking .eyes{transform:scaleY(.08)}
.cx[data-mood=listening] .eyes{transform:scale(1.07)}
.cx[data-mood=thinking] .face{transform:translate(4px,-4px)}
.cx[data-mood=thinking] .mouth-s{opacity:1}
.cx[data-mood=thinking] .brow-l{opacity:1;transform:translateY(-3px)}
.cx[data-mood=talking] .mouth{opacity:1;animation:cx-talk .28s ease-in-out infinite alternate}
@keyframes cx-talk{from{transform:scaleY(.25)}to{transform:scaleY(var(--mouth,.95))}}
.cx[data-mood=happy] .eo{opacity:0}
.cx[data-mood=happy] .eh,.cx[data-mood=happy] .smile{opacity:1}
.cx[data-mood=attention] .face{transform:translate(6px,-3px)}
.cx[data-mood=attention] .eyes{transform:scale(1.08)}
.cx[data-mood=attention] .brow{opacity:1;transform:translateY(-4px)}
.cx[data-mood=concerned] .eo{transform-origin:100px 126px;transform:scaleY(.8) translateY(3px)}
.cx[data-mood=concerned] .mouth-w{opacity:1}
.cx[data-mood=concerned] .brow{opacity:1}
.cx[data-mood=concerned] .brow-l{transform-origin:76px 104px;transform:rotate(-15deg)}
.cx[data-mood=concerned] .brow-r{transform-origin:124px 104px;transform:rotate(15deg)}
.cx[data-mood=sleepy] .eo{opacity:0}
.cx[data-mood=sleepy] .ec{opacity:1}

/* Small shared motion. Calm halves it, lively doubles the rhythm; reduced motion removes it. */
.cx.m-calm .breath,.cx.m-calm .sway{animation-duration:9s}
.cx.m-lively .breath{animation-duration:2.8s}
html.rm .cx,html.rm .cx *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){html:not(.rm-off) .cx,html:not(.rm-off) .cx *{animation:none!important}}

/* Props sit on anchors; they never take colour from the mood. */
.cx .prop{pointer-events:none}
.cx .prop-cup .steam{animation:cx-steam 3.2s ease-in-out infinite}
@keyframes cx-steam{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:.8;transform:translateY(-3px)}}

/* small acts (the idle director triggers these now and then) */
.cx.act-tilt .pose{animation:cx-tilt 2.4s ease-in-out 1}
@keyframes cx-tilt{0%,100%{transform:rotate(0)}30%,70%{transform:rotate(6deg) translateX(3px)}}
.cx.act-stretch .pose{animation:cx-stretch 2.2s ease-in-out 1}
@keyframes cx-stretch{0%,100%{transform:scale(1,1)}40%,60%{transform:scale(.97,1.07)}}
.cx.act-hum .pose{animation:cx-hum 2.6s ease-in-out 1}
@keyframes cx-hum{0%,100%{transform:rotate(0)}20%{transform:rotate(-3deg) translateY(-2px)}50%{transform:rotate(3deg)}80%{transform:rotate(-2deg) translateY(-2px)}}

.tc-host{display:block}
.tc{display:block;width:100%;height:auto;overflow:visible}
.tc-brass{--tc-body:#f0dcb8;--tc-light:#f7e9d0;--tc-shade:#d9bd91;--tc-ink:#4a3820;--tc-foot:#d6b98c;--tc-arm:#e6cda4}
.tc .tc-floor{fill:var(--text);opacity:.08}
.tc .tc-foot{fill:var(--tc-foot)}
.tc .tc-arm ellipse{fill:var(--tc-arm)}
.tc .tc-rim{fill:none;stroke:#fff;stroke-opacity:.75;stroke-width:3.5;stroke-linecap:round}
.tc .tc-stem{fill:none;stroke:var(--tc-shade);stroke-width:3.5;stroke-linecap:round}
.tc .tc-dot{fill:var(--tc-dot);transition:fill .4s,opacity .4s}
.tc .tc-glow{opacity:0;transition:opacity .5s}
.tc .tc-eye-open rect{fill:var(--tc-ink)}
.tc .tc-spark{fill:#fff;opacity:.9}
.tc .tc-eye-happy path,.tc .tc-eye-closed path,.tc .tc-smile{fill:none;stroke:var(--tc-ink);stroke-width:4;stroke-linecap:round}
.tc .tc-eye-happy,.tc .tc-eye-closed,.tc .tc-smile,.tc .tc-mouth,.tc .tc-zzz{opacity:0;transition:opacity .2s}
.tc .tc-mouth{fill:#8a4535;transform-origin:100px 146px;transform:scaleY(.3)}
.tc .tc-cheek{fill:var(--tc-cheek);opacity:.36}
.tc .tc-face{transform:translate(var(--look-x,0),var(--look-y,0));transition:transform .4s cubic-bezier(.3,.7,.3,1)}
.tc .tc-eyes{transform-origin:100px 116px;transition:transform .06s}
.tc.is-blinking .tc-eyes{transform:scaleY(.08)}
.tc .tc-pose{transform-origin:100px 206px;transition:transform .45s cubic-bezier(.3,.7,.3,1)}
.tc .tc-breath{transform-origin:100px 206px;animation:tc-breathe 4.4s ease-in-out infinite}
.tc .tc-antenna{transform-origin:100px 46px;animation:tc-sway 6.5s ease-in-out infinite}
@keyframes tc-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,.988)}}
@keyframes tc-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.tc[data-mood=listening] .tc-pose{transform:translateY(-3px) scale(1.025)}
.tc[data-mood=listening] .tc-glow{opacity:.55}
.tc[data-mood=listening] .tc-eyes{transform:scale(1.06)}
.tc[data-mood=thinking] .tc-pose{animation:tc-think 3.2s ease-in-out infinite}
.tc[data-mood=thinking] .tc-face{transform:translate(3px,-3px)}
.tc[data-mood=thinking] .tc-glow{animation:tc-pulse 1.4s ease-in-out infinite}
@keyframes tc-think{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes tc-pulse{0%,100%{opacity:.12}50%{opacity:.8}}
.tc[data-mood=talking] .tc-mouth{opacity:1;animation:tc-talk .28s ease-in-out infinite alternate}
.tc[data-mood=talking] .tc-glow{opacity:.5}
@keyframes tc-talk{from{transform:scaleY(.25)}to{transform:scaleY(var(--mouth,.95))}}
.tc[data-mood=happy] .tc-eye-open{opacity:0}
.tc[data-mood=happy] .tc-eye-happy,.tc[data-mood=happy] .tc-smile{opacity:1}
.tc[data-mood=happy] .tc-pose{animation:tc-hop .75s cubic-bezier(.3,.7,.3,1) 2}
.tc[data-mood=happy] .tc-arm-right{transform-origin:164px 132px;animation:tc-wave .45s ease-in-out 4}
@keyframes tc-hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px) scale(1.02,.98)}}
@keyframes tc-wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg)}}
/* Attention is a glance toward the amber light; the antenna stays the character's own colour. */
.tc[data-mood=attention] .tc-face{transform:translate(5px,-2px)}
.tc[data-mood=concerned] .tc-eyes{transform:scaleY(.82) translateY(2px)}
.tc[data-mood=concerned] .tc-pose{transform:translateY(2px)}
.tc[data-mood=sleepy] .tc-eye-open{opacity:0}
.tc[data-mood=sleepy] .tc-eye-closed,.tc[data-mood=sleepy] .tc-zzz{opacity:1}
.tc[data-mood=sleepy] .tc-breath{animation-duration:7s}
.tc[data-mood=sleepy] .tc-dot{opacity:.35}
.tc[data-mood=sleepy] .tc-antenna{animation:none;transform:rotate(14deg)}
.tc .tc-zzz text{font:700 17px var(--font-ui);fill:var(--muted);animation:tc-z 3.4s ease-in-out infinite}
.tc .tc-zzz text:nth-child(2){animation-delay:1.7s;font-size:13px}
@keyframes tc-z{0%{opacity:0;transform:translate(0,6px)}35%{opacity:.85}100%{opacity:0;transform:translate(9px,-16px)}}
.talk-avatar .tc{width:46px}
.talk-avatar .tc-floor,.talk-avatar .tc-zzz{display:none}
.cx-legacy{--tc-body:var(--c-body);--tc-light:var(--c-light);--tc-shade:var(--c-shade);--tc-ink:var(--c-ink);--tc-cheek:var(--c-cheek);--tc-dot:var(--c-lamp);--tc-foot:var(--c-foot);--tc-arm:var(--c-limb)}
[data-theme=lamp] .cx-legacy .tc-dot{opacity:1;filter:drop-shadow(0 0 5px rgba(255,150,110,.95)) drop-shadow(0 0 12px rgba(239,122,88,.7))}

/* ===== しろ・改 ===== */
.cx-shiro .stem{fill:none;stroke:var(--c-shade);stroke-width:3.6;stroke-linecap:round}
.cx-shiro .antenna{transform-origin:var(--ox) var(--oy);transform:rotate(var(--ant));transition:transform .55s cubic-bezier(.3,.7,.3,1)}
.cx-shiro .sway{transform-origin:var(--ox) var(--oy);animation:cx-sway 6.5s ease-in-out infinite}
@keyframes cx-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.cx-shiro .pose{transform-origin:100px 206px;transform:translateY(var(--lift)) rotate(var(--lean)) scale(var(--sq));transition:transform .45s cubic-bezier(.3,.7,.3,1)}
.cx-shiro .breath{transform-origin:100px 206px;animation:cx-breathe 4.4s ease-in-out infinite}
@keyframes cx-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,.988)}}
.cx-shiro .foot{fill:var(--c-foot)}
.cx-shiro .mitt{fill:var(--c-limb);stroke:var(--c-shade);stroke-opacity:.45;stroke-width:1}
.cx-shiro .rim{fill:none;stroke:#fff;stroke-opacity:.8;stroke-width:3.4;stroke-linecap:round}
.cx-shiro .limb{fill:var(--c-limb);stroke:var(--c-shade);stroke-opacity:.35;stroke-width:1}
.cx-shiro .ear{transform-origin:var(--ox) var(--oy);transition:transform .45s cubic-bezier(.3,.7,.3,1)}

/* moods */
.cx-shiro[data-mood=listening] .ear{transform:scaleY(1.06)}
.cx-shiro[data-mood=thinking] .pose{animation:cx-think 3.2s ease-in-out infinite}
.cx-shiro[data-mood=thinking] .ear-l{transform:rotate(-8deg)}
@keyframes cx-think{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.cx-shiro[data-mood=happy] .pose{animation:cx-hop .75s cubic-bezier(.3,.7,.3,1) 2}
.cx-shiro[data-mood=happy] .arm-r{animation:cx-wave-r 1.9s ease-in-out 1}
.cx-shiro .arm{transform-origin:var(--ox) var(--oy)}
@keyframes cx-hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px) scale(1.02,.98)}}
@keyframes cx-wave-r{0%,100%{transform:rotate(0)}18%{transform:rotate(-100deg)}34%{transform:rotate(-76deg)}50%{transform:rotate(-104deg)}66%{transform:rotate(-76deg)}82%{transform:rotate(-100deg)}}
.cx-shiro[data-mood=attention] .ear{transform:scaleY(1.08) rotate(4deg)}
.cx-shiro[data-mood=concerned] .ear-l{transform:rotate(-16deg)}.cx-shiro[data-mood=concerned] .ear-r{transform:rotate(16deg)}
.cx-shiro[data-mood=sleepy] .breath{animation-duration:7s}
.cx-shiro[data-mood=sleepy] .sway{animation:none}
.cx-shiro[data-mood=sleepy]{--ant:-44deg}
.cx-shiro[data-mood=sleepy] .ear-l{transform:rotate(-22deg)}.cx-shiro[data-mood=sleepy] .ear-r{transform:rotate(22deg)}


/* ===== 灯守 ===== */
.cx-andon{--pg:.16;--pg-add:0;--cap:#3a332b;--cap-hl:#6d6256;--rib:#8a6a3c}
[data-theme=dark] .cx-andon{--pg:.5;--cap:#2b2621;--cap-hl:#5d5448}
[data-theme=lamp] .cx-andon{--pg:.95;--cap:#241f1a;--cap-hl:#5a5044}
.cx-andon .stem{fill:none;stroke:var(--cap);stroke-width:3;stroke-linecap:round}
.cx-andon .antenna{transform-origin:var(--ox) var(--oy);transform:rotate(var(--ant));transition:transform .55s cubic-bezier(.3,.7,.3,1)}
.cx-andon .sway{transform-origin:var(--ox) var(--oy);animation:cx-sway 7s ease-in-out infinite}
.cx-andon .pose{transform-origin:100px 206px;transform:translateY(var(--lift)) rotate(var(--lean)) scale(var(--sq));transition:transform .45s cubic-bezier(.3,.7,.3,1)}
.cx-andon .breath{transform-origin:100px 206px;animation:cx-breathe 5s ease-in-out infinite}
.cx-andon .cap,.cx-andon .lid,.cx-andon .foot{fill:var(--cap)}
.cx-andon .cap-hl{fill:var(--cap-hl);opacity:.7}
.cx-andon .nub{fill:var(--c-limb);stroke:var(--c-shade);stroke-opacity:.5;stroke-width:1}
.cx-andon .edge{stroke:var(--c-shade);stroke-opacity:.55;stroke-width:1.2}
.cx-andon .ribs path{fill:none;stroke:var(--rib);stroke-opacity:.2;stroke-width:1.4}
.cx-andon .inner{opacity:clamp(0,calc(var(--pg) + var(--pg-add)),1);transition:opacity .6s}
.cx-andon .soma .sil{opacity:0;transform-box:fill-box}
[data-theme=lamp] .cx-andon .lantern{filter:drop-shadow(0 0 16px rgba(255,186,106,.38))}
[data-theme=dark] .cx-andon .lantern{filter:drop-shadow(0 0 10px rgba(255,186,106,.2))}
[data-theme=lamp] .cx-andon .lamp-dot{filter:drop-shadow(0 0 5px rgba(var(--c-lamp-rgb),.95)) drop-shadow(0 0 12px rgba(var(--c-lamp-rgb),.65))}
.cx-andon .eo rect,.cx-andon .eo circle:not(.catch),.cx-andon .eo ellipse,.cx-andon .eo path{fill:var(--c-ink);fill-opacity:.9}
.cx-andon .catch{opacity:.0}
.cx-andon .cheek{opacity:.3}
.cx-andon .eh path,.cx-andon .ec path,.cx-andon .smile,.cx-andon .mouth-w,.cx-andon .mouth-s,.cx-andon .brow{stroke-opacity:.9}

/* moods */
.cx-andon[data-mood=listening]{--pg-add:.22}
.cx-andon[data-mood=thinking]{--pg-add:.3}
.cx-andon[data-mood=thinking] .inner{animation:cx-flicker 2.2s ease-in-out infinite}
@keyframes cx-flicker{0%,100%{opacity:clamp(0,calc(var(--pg) + var(--pg-add)),1)}35%{opacity:clamp(0,calc(var(--pg) + var(--pg-add) - .16),1)}60%{opacity:clamp(0,calc(var(--pg) + var(--pg-add) + .1),1)}}
.cx-andon[data-mood=thinking] .pose{animation:cx-think 3.6s ease-in-out infinite}
@keyframes cx-think{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}
.cx-andon[data-mood=talking]{--pg-add:.2}
.cx-andon[data-mood=talking] .inner{animation:cx-voice .46s ease-in-out infinite alternate}
@keyframes cx-voice{from{opacity:clamp(0,calc(var(--pg) + var(--pg-add) - .1),1)}to{opacity:clamp(0,calc(var(--pg) + var(--pg-add) + .14),1)}}
.cx-andon[data-mood=happy]{--pg-add:.4}
.cx-andon[data-mood=happy] .pose{animation:cx-hop .75s cubic-bezier(.3,.7,.3,1) 2}
@keyframes cx-hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px) scale(1.02,.98)}}
.cx-andon[data-mood=attention]{--pg-add:.18}
.cx-andon[data-mood=concerned]{--pg-add:-.1}

.cx-kage .eo rect,.cx-kage .eo circle,.cx-kage .eo ellipse{fill:var(--glowc);filter:drop-shadow(0 0 3px rgba(255,236,190,.9))}
.cx-kage .eh path,.cx-kage .ec path,.cx-kage .smile{fill:none;stroke:var(--glowc);stroke-width:4.4;stroke-linecap:round}
.cx-kage .mouth{fill:var(--glowc)}
.cx-kage .eyes{transform-origin:100px 126px}
.cx-kage .cheek{display:none}
.cx-kage .fx-z text,.cx-kage .fx-dots circle{fill:var(--puppet);opacity:.7}
.cx-kage .fx-spark path{fill:var(--puppet)}
.cx-kage .fx-sweat{stroke:var(--puppet);fill:rgba(255,255,255,.7)}

/* distance is attention */
.cx-kage[data-mood=listening]{--dist:0}
.cx-kage[data-mood=thinking]{--dist:.42}
.cx-kage[data-mood=thinking] .puppet-pos{animation:cx-waver 3.6s ease-in-out infinite}
@keyframes cx-waver{0%,100%{transform:translateX(-3px) rotate(-1.4deg)}50%{transform:translateX(3px) rotate(1.4deg)}}
.cx-kage[data-mood=talking]{--dist:.16}
.cx-kage[data-mood=talking] .puppet{animation:cx-voice3 .46s ease-in-out infinite alternate}
@keyframes cx-voice3{from{transform:scale(1.0)}to{transform:scale(1.035)}}
.cx-kage[data-mood=happy]{--dist:.08}
.cx-kage[data-mood=happy] .puppet-pos{animation:cx-hop .75s cubic-bezier(.3,.7,.3,1) 2}
.cx-kage[data-mood=attention]{--dist:.22}
.cx-kage[data-mood=concerned]{--dist:.7}
.cx-kage[data-mood=sleepy]{--dist:1}
.cx-kage[data-mood=sleepy] .sway{animation:none}
.cx-kage[data-mood=sleepy]{--ant:-34deg}
[data-theme=lamp] .cx-kage .lamp-dot{filter:drop-shadow(0 0 6px rgba(var(--c-lamp-rgb),.95)) drop-shadow(0 0 14px rgba(var(--c-lamp-rgb),.7))}
.cx-kage{--paper-o:1}
[data-theme=dark] .cx-kage{--paper-o:.8}[data-theme=lamp] .cx-kage{--paper-o:.62}
.cx-kage .paper-base{fill:#17110c}
.cx-kage .paper{opacity:var(--paper-o)}
[data-theme=lamp] .cx-kage .paper-glow{opacity:.9}
[data-theme=dark] .cx-kage{--k-p0:#f3d9a8;--k-p1:#cdb48a;--k-p2:#8c7655;--k-p3:#4a3c2c}
[data-theme=lamp] .cx-kage{--k-p0:#ffcf8a;--k-p1:#c98f52;--k-p2:#6b4727;--k-p3:#2a1c10;--paper-o:1}
[data-theme=lamp] .cx-kage .paper-glow{opacity:1}

/* ===== ちいさな部屋 ===== */
.cx-room{--wall-a:var(--c-shade);--wall-b:var(--c-light);--floor-a:#cdb58f;--floor-b:#b99d72;--skirt:#a8895a;--wood:#6b5337;--sky:#fdf3d8;--sunp:.5;--poolo:.25;--amber-o:0;--wallglow:0}
[data-theme=dark] .cx-room{--wall-a:#6a5d4b;--wall-b:#8a7a62;--floor-a:#4a3d2d;--floor-b:#3a2f22;--skirt:#2e2519;--wood:#2e2417;--sky:#46506a;--sunp:.12;--poolo:.5}
[data-theme=lamp] .cx-room{--wall-a:#2c231b;--wall-b:#4a3a2b;--floor-a:#2c241b;--floor-b:#1f1913;--skirt:#17120d;--wood:#17110b;--sky:#1a2136;--sunp:0;--poolo:1}
[data-theme=dark] .cx-room .shade,[data-theme=lamp] .cx-room .shade{fill:#d9b98a}
.cx-room .skirt{fill:var(--skirt)}
.cx-room .planks path{fill:none;stroke:#000;stroke-opacity:.12;stroke-width:1.2}
.cx-room .win-sky{fill:var(--sky)}
.cx-room .win-frame{fill:none;stroke:var(--wood);stroke-width:4}
.cx-room .win-lat{fill:none;stroke:var(--wood);stroke-width:1.8;stroke-opacity:.8}
.cx-room .stars{opacity:0;fill:#fdf1c8}
[data-theme=lamp] .cx-room .stars{opacity:.95}
.cx-room .sunpatch{fill:#fff7de;opacity:var(--sunp)}
.cx-room .pool-f,.cx-room .pool-w{opacity:calc(var(--poolo) + var(--glow)*.5);transition:opacity .6s}
.cx-room .shelf rect{fill:var(--wood)}
.cx-room .shelf .tray{fill:var(--c-shade)}
.cx-room .shelf .book{fill:#8a7a5c}.cx-room .shelf .b2{fill:#a98f6a}
.cx-room .amber{fill:var(--lamp-wait,#e2a12a);opacity:var(--amber-o);transition:opacity .4s;filter:drop-shadow(0 0 5px rgba(226,161,42,.8))}
.cx-room .table ellipse:not(.tb){fill:var(--wood)}.cx-room .table rect{fill:var(--wood)}.cx-room .table .tb{fill:#000;opacity:.12}
.cx-room .cup path:not(.steam){fill:#f4f0e6;stroke:#cbbf9f;stroke-width:1}
.cx-room .steam{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-linecap:round;animation:cx-steam 3.2s ease-in-out infinite}
.cx-room .pole,.cx-room .base{fill:#4a3d2d}
.cx-room .shade{fill:var(--c-body);stroke:var(--c-shade);stroke-width:1.2}
.cx-room .shade-hl{fill:#fff;opacity:.35}
.cx-room .cushion{fill:var(--c-limb);stroke:var(--c-shade);stroke-opacity:.6;stroke-width:1.2}
.cx-room .room-edge{fill:none;stroke:var(--line-strong);stroke-width:2}
.cx-room .foot{fill:var(--c-foot)}
.cx-room .resident-pos{transform-origin:100px 176px;transform:translateY(var(--lift)) rotate(var(--lean));transition:transform .45s cubic-bezier(.3,.7,.3,1)}
.cx-room .breath2{transform-origin:100px 206px;animation:cx-breathe 4.4s ease-in-out infinite}
.cx-room .face{transform:translate(calc(var(--look-x)*2.2),calc(var(--look-y)*2.2))}
.cx-room[data-mood=thinking] .face{transform:translate(10px,-9px)}
.cx-room[data-mood=attention] .face{transform:translate(14px,-12px)}
.cx-room[data-mood=listening]{--poolo:.4}
.cx-room[data-mood=attention]{--amber-o:1}
.cx-room[data-mood=attention] .amber{animation:cx-ripple 1.3s ease-in-out infinite}
.cx-room[data-mood=happy] .resident-pos{animation:cx-hop .75s cubic-bezier(.3,.7,.3,1) 2}
.cx-room[data-mood=concerned] .pool-f,.cx-room[data-mood=concerned] .pool-w{animation:cx-flick 1.3s steps(5,end) infinite}
.cx-room[data-mood=sleepy] .steam{animation:none;opacity:0}
.cx-room[data-mood=sleepy]{--poolo:.2}
.cx-room[data-mood=sleepy] .win-sky{fill:#1a2136}
.cx-room[data-mood=sleepy] .stars{opacity:.95}
.cx-room[data-mood=sleepy] .sunpatch{opacity:0}
.cx-room.has-wait{--amber-o:1}

/* ===== 持ち込み（画像） ===== */
.cx-image .pose{transform-origin:100px 208px;transform:translateY(var(--lift)) rotate(var(--lean)) scale(var(--sq));transition:transform .45s cubic-bezier(.3,.7,.3,1)}
.cx-image .breath{transform-origin:100px 208px;animation:cx-breathe 4.6s ease-in-out infinite}
.cx-image .pic{filter:drop-shadow(0 5px 6px rgba(60,40,20,.18));transition:filter .5s}
.cx-image .pic-halo{opacity:calc(.2 + var(--glow)*.9);transition:opacity .6s}
.cx-image .bead{animation:cx-bob 3.8s ease-in-out infinite;transform-origin:var(--ox) var(--oy)}
.cx-image[data-mood=listening] .pose{transform:translateY(-4px) rotate(-1.5deg) scale(1.04)}
.cx-image[data-mood=thinking] .pose{animation:cx-think 3.4s ease-in-out infinite}
.cx-image[data-mood=talking] .pose{animation:cx-voice3 .46s ease-in-out infinite alternate}
.cx-image[data-mood=happy] .pose{animation:cx-hop .75s cubic-bezier(.3,.7,.3,1) 2}
.cx-image[data-mood=attention] .pose{transform:rotate(3.5deg) translateY(-2px)}
.cx-image[data-mood=concerned] .pic{filter:saturate(.7) drop-shadow(0 3px 4px rgba(60,40,20,.18))}
.cx-image[data-mood=concerned] .pose{transform:translateY(3px) scale(.98)}
.cx-image[data-mood=sleepy] .pic{filter:brightness(.82) saturate(.55)}
.cx-image[data-mood=sleepy] .pose{transform:translateY(6px) scale(.96)}
.cx-image[data-mood=sleepy] .breath{animation-duration:8s}
[data-theme=lamp] .cx-image .pic{filter:brightness(.78) sepia(.25) drop-shadow(0 0 12px rgba(var(--c-lamp-rgb),.3))}
[data-theme=lamp] .cx-image .lamp-dot{filter:drop-shadow(0 0 6px rgba(var(--c-lamp-rgb),.95)) drop-shadow(0 0 14px rgba(var(--c-lamp-rgb),.7))}

/* ===== stage mock (mirrors Tepora-v3/web/styles.css: stage, caption, clock, window light, glow, lights) ===== */
.sm{position:relative;overflow:hidden;border-radius:20px;border:1px solid var(--line);background:var(--bg);color:var(--text);box-shadow:var(--shadow);--char-w:clamp(190px,24vw,300px);min-height:560px;display:flex;flex-direction:column;isolation:isolate}
.sm-wall{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.sm-tint{position:absolute;inset:0;background:var(--sky-tint,transparent);transition:background 1.4s}
.sm-sun{position:absolute;top:7%;bottom:3%;left:calc(var(--sun-x,10)*1%);width:44%;transform:skewX(calc(var(--sun-skew,0)*1deg));opacity:var(--sun-o,0);filter:blur(calc(var(--sun-blur,6)*1px));-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 78%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 78%,transparent 100%);background:linear-gradient(90deg,transparent 0,var(--sun-color,#fffaf0) 12%,var(--sun-color,#fffaf0) 88%,transparent 100%);transition:left .6s ease,opacity .6s ease}
.sm-sun::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(33.333% - 2.4px),rgba(120,88,44,var(--sun-lines,.1)) calc(33.333% - 2.4px),rgba(120,88,44,var(--sun-lines,.1)) 33.333%),repeating-linear-gradient(0deg,transparent 0,transparent calc(25% - 2.4px),rgba(120,88,44,var(--sun-lines,.1)) calc(25% - 2.4px),rgba(120,88,44,var(--sun-lines,.1)) 25%)}
.sm[data-theme=lamp] .sm-sun{display:none}
.sm[data-theme=dark] .sm-sun{opacity:calc(var(--sun-o,0)*.1);mix-blend-mode:screen}
.sm>*:not(.sm-wall){position:relative;z-index:1}
.sm-bar{display:flex;align-items:center;gap:18px;padding:14px 22px;font-size:.84rem}
.wm{font:600 1.35rem/1 var(--font-num);letter-spacing:-.02em;display:inline-flex;align-items:flex-start;gap:2px;color:var(--text)}
.wm i{width:7px;height:7px;border-radius:50%;background:var(--brand);margin-top:1px;display:inline-block}
.sm.has-wait .wm i{background:var(--lamp-wait)}
.sm-bar nav{display:flex;gap:6px}.sm-bar nav span,.sm-bar nav b{padding:6px 12px;border-radius:10px;color:var(--muted);font-weight:500}.sm-bar nav b{background:var(--accent-soft);color:var(--text)}
.sm-pill{margin-left:auto;color:var(--muted);display:inline-flex;align-items:center;gap:7px}.sm-pill i{width:7px;height:7px;border-radius:50%;background:var(--line-strong)}
.sm-grid{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.82fr);gap:28px;padding:0 clamp(18px,4vw,56px);align-items:center;min-height:0}
.sm-figure{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,2.4vh,26px)}
.sm-char{position:relative;width:min(100%,calc(var(--char-w)*var(--scale,1)));aspect-ratio:200/224;transition:width .4s}
.sm.is-scene .sm-char{width:min(100%,calc(var(--char-w)*1.5));}
.sm-host{position:absolute;inset:0}
.sm-glow{position:absolute;inset:0;pointer-events:none;z-index:-1}
.sm-glow::before{content:'';position:absolute;left:50%;top:62%;width:270%;height:210%;transform:translate(-50%,-50%);background:radial-gradient(ellipse at center,var(--pool-color),transparent 70%);opacity:var(--pool-o,0);transition:opacity 1.2s}
.sm-glow::after{content:'';position:absolute;left:var(--ant-x);top:var(--ant-y);width:135%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,var(--glow-1),var(--glow-2) 38%,transparent 68%);opacity:var(--halo-o,0);transition:opacity 1.2s}
.sm[data-theme=lamp] .sm-glow::before{opacity:calc(var(--pool-o,0) + 1)}.sm[data-theme=lamp] .sm-glow::after{opacity:calc(var(--halo-o,0) + 1)}
.sm.is-scene .sm-glow{display:none}
.sm-caption{margin:0;max-width:min(30rem,92%);text-align:center;font:400 1.05rem/1.85 var(--font-display);letter-spacing:.01em;min-height:3.7em}
.sm-caption.is-empty{opacity:0}
.sm-side{display:flex;flex-direction:column;gap:clamp(18px,3.5vh,34px);min-width:0}
.sm-clock time{display:block;font:200 clamp(3.4rem,6.4vw,6.6rem)/.95 var(--font-num);letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.sm-line{display:flex;flex-wrap:wrap;gap:0 .9em;margin-top:.7rem;align-items:baseline}
.sm-line b{font:600 1.02rem/1.5 var(--font-display);letter-spacing:.02em}.sm-line span{font:400 .84rem/1.5 var(--font-display);color:var(--muted)}
.sm-weather{display:flex;gap:.7em;align-items:baseline;margin-top:.7rem;color:var(--muted);font-size:.9rem}.sm-weather .wt{font:200 1.7rem/1 var(--font-num);color:var(--text);letter-spacing:-.03em}
.sm-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 20px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:10px;min-height:130px}
.sm-card small{font-weight:700;font-size:.72rem;color:var(--muted)}.sm-card p{margin:0;font:600 1.02rem/1.6 var(--font-display)}.sm-card em{margin-top:auto;font-style:normal;color:var(--muted);font-size:.74rem}
.sm-composer{margin:18px auto 20px;width:min(440px,calc(100% - 40px));display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);color:var(--muted);font-size:.88rem}
.sm-composer .ph{flex:1}.sm-composer .go{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:inline-grid;place-items:center}
/* lights: the work as small fireflies, the amber lamp as the one call for you */
.sm-lights{position:absolute;inset:0;pointer-events:none;z-index:2}
.ff{position:absolute;left:var(--lx);top:var(--ly);width:28px;height:28px;margin:-14px 0 0 -14px;opacity:0}
.ff.on{opacity:1;transition:opacity .9s}
.ff b{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:currentColor;color:var(--muted);opacity:.92;animation:ff-drift var(--dur,11s) ease-in-out infinite;animation-delay:var(--del,0s)}
.ff b::after{content:'';position:absolute;left:-1px;top:-1px;width:100%;height:100%;border-radius:50%;border:1px solid currentColor;opacity:0;animation:ff-ripple 4.6s ease-out infinite;animation-delay:var(--rd,0s)}
.ff-wait{z-index:3}.ff-wait b{width:11px;height:11px;margin:-5.5px 0 0 -5.5px;color:var(--lamp-wait);opacity:1;box-shadow:0 0 18px 5px rgba(226,161,42,.38);animation:none}
.ff-wait b::after{animation-duration:2.8s;border-width:1.5px}
.ff-label{position:absolute;left:calc(50% + 18px);top:50%;margin-top:-10px;display:flex;align-items:center;gap:.4em;height:20px;white-space:nowrap;font-size:.76rem;font-weight:700;color:var(--text)}
.ff-count{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
[data-theme=lamp] .ff b{color:#ecdcb6;box-shadow:0 0 14px 3px rgba(236,220,182,.24)}[data-theme=lamp] .ff-wait b{color:var(--lamp-wait);box-shadow:0 0 18px 5px rgba(226,161,42,.4)}
@keyframes ff-drift{0%,100%{translate:0 0}33%{translate:var(--ax,6px) var(--ay,-8px)}66%{translate:calc(var(--ax,6px)*-.6) calc(var(--ay,-8px)*.4)}}
@keyframes ff-ripple{0%{transform:scale(1);opacity:.55}100%{transform:scale(4);opacity:0}}
html.rm .ff b,html.rm .ff b::after{animation:none!important}
@media (max-width:820px){.sm{min-height:0}.sm-grid{grid-template-columns:1fr;gap:18px;padding-top:8px}.sm-bar nav{display:none}.sm-char{width:min(70%,calc(240px*var(--scale,1)))}.sm-clock time{font-size:3.2rem}}

.sm.is-scene .ff-label{background:var(--surface);border:1px solid var(--line-strong);border-radius:99px;padding:0 10px;box-shadow:var(--shadow-sm);left:calc(50% + 14px)}
.sm.is-scene .sm-char{width:min(100%,calc(var(--char-w)*1.45))}

/* ===== the lab page itself: paper, ink and one lamp ===== */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:74px}
html.rm{scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.75 var(--font-ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,p,ul,ol,dl,dd,pre,fieldset{margin:0}
ul,ol{padding:0;list-style:none}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
a{color:inherit}
code{font:500 .74rem var(--font-mono);color:var(--muted);background:var(--bg-2);padding:2px 7px;border-radius:6px}
.small{font-size:.82rem;color:var(--muted)}
.honest{margin-top:22px;padding:14px 16px;border:1px dashed var(--line-strong);border-radius:12px}

/* top bar */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:10px clamp(16px,3vw,36px);background:var(--bg);border-bottom:1px solid var(--line)}
.wm{font:600 1.35rem/1 var(--font-num);letter-spacing:-.02em;display:inline-flex;align-items:flex-start;gap:2px;text-decoration:none}
.wm i{width:7px;height:7px;border-radius:50%;background:var(--brand);margin-top:1px;display:inline-block}
.top-t{font:600 .98rem var(--font-display);display:flex;align-items:baseline;gap:10px}.top-t small{font:500 .72rem var(--font-ui);color:var(--muted);border:1px solid var(--line-strong);border-radius:999px;padding:1px 9px}
.top-nav{display:flex;gap:2px;margin-left:8px}.top-nav a{text-decoration:none;color:var(--muted);font-size:.84rem;font-weight:600;padding:6px 10px;border-radius:9px}.top-nav a:hover{background:var(--accent-soft);color:var(--text)}
.top-ctl{margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted);cursor:pointer}.chk input{accent-color:var(--brand);width:16px;height:16px}

/* controls */
.seg{display:inline-flex;gap:3px;padding:3px;background:var(--bg-2);border-radius:12px;flex-wrap:wrap;vertical-align:middle}
.seg button{border:0;background:transparent;color:var(--muted);font:600 .8rem/1.2 var(--font-ui);padding:8px 12px;border-radius:9px;cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;gap:1px}
.seg button small{font-weight:500;font-size:.64rem;opacity:.8}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed=true]{background:var(--surface-2);color:var(--text);box-shadow:var(--shadow-sm)}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:10px 18px;font:700 .84rem/1 var(--font-ui);cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line-strong)}
.chip{border:1px solid var(--line-strong);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 12px;font:600 .78rem/1 var(--font-ui);cursor:pointer}.chip:hover{background:var(--accent-soft)}
.lab{font-size:.74rem;font-weight:700;color:var(--muted);margin:12px 0 6px;letter-spacing:.04em}
.ctl{display:flex;flex-direction:column;gap:6px;font-size:.82rem;color:var(--muted);min-width:0}.ctl b{color:var(--text);font-variant-numeric:tabular-nums}
.ctl input[type=range]{width:100%;accent-color:var(--brand)}
.ctl.txt input{border:1px solid var(--line-strong);background:var(--surface-2);border-radius:10px;padding:9px 12px;font-size:.92rem;width:100%}
.ctl-rows{display:grid;gap:12px;margin-bottom:16px}.ctl-row{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end}.ctl-row .ctl{min-width:150px}

main{max-width:1240px;margin:0 auto;padding:0 clamp(16px,3vw,36px) 80px}
.hero{padding:clamp(34px,7vw,76px) 0 22px}
.hero h1{font:600 clamp(1.9rem,4.6vw,3.2rem)/1.35 var(--font-display);letter-spacing:.01em}
.lead{max-width:44rem;margin-top:18px;font-size:1.02rem;color:var(--text)}.lead b{border-bottom:2px solid var(--brand)}
.finds{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:30px}
.find{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-sm)}

<body>
<div id="app"></div>
<script>
/* ===== core: registry, palettes, recipe, mount ===== */
const BODIES={},LIVE=new Set(),ALL=new Set(),ORDER=[];
const defineBody=d=>{BODIES[d.id]=d;ORDER.push(d.id);return d;};
let _uid=0;const uid=()=>`u${++_uid}`;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---- colour helpers ---- */
const hex2rgb=h=>{h=h.replace('#','');if(h.length===3)h=[...h].map(c=>c+c).join('');const n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255];};
const rgb2hex=a=>'#'+a.map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(A.map((v,i)=>v+(B[i]-v)*t));};
const lum=h=>{const [r,g,b]=hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4;});return .2126*r+.7152*g+.0722*b;};
const contrast=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);};
const hsl=(h,s,l)=>{h=((h%360)+360)%360;s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return rgb2hex([f(0)*255,f(8)*255,f(4)*255]);};
const rgba=(hex,a)=>{const [r,g,b]=hex2rgb(hex);return `rgba(${r},${g},${b},${a})`;};

/* ---- materials (素材): one knob that always yields a coherent, readable set ---- */
const PALETTES={
 washi:{name:'和紙',body:'#fbf6ec',light:'#fffdf9',shade:'#e8dcc7',ink:'#2b2722',cheek:'#ef9f86',limb:'#efe4d2',foot:'#e6d8c1'},
 porcelain:{name:'陶器',body:'#f1f5f6',light:'#ffffff',shade:'#cdd8dc',ink:'#24303a',cheek:'#eaa8a2',limb:'#e3ecee',foot:'#cfdadd'},
 felt:{name:'フェルト',body:'#e8dcc3',light:'#f4ead6',shade:'#cbb88f',ink:'#3a2e22',cheek:'#e39a7e',limb:'#dccdae',foot:'#c9b68c'},
 moss:{name:'苔',body:'#a9ba8c',light:'#c6d4aa',shade:'#7c9066',ink:'#26331f',cheek:'#e6a58c',limb:'#9aae7c',foot:'#7c9066'},
 sora:{name:'空',body:'#dde8f2',light:'#f0f6fb',shade:'#b4c6d8',ink:'#26364a',cheek:'#eaa7a0',limb:'#cfdeeb',foot:'#aebfd1'},
 sakura:{name:'桜',body:'#f7e4e2',light:'#fff4f2',shade:'#e2bdb9',ink:'#3b2a2c',cheek:'#ee9a92',limb:'#f0d6d3',foot:'#dfb8b4'},
 kitsune:{name:'狐色',body:'#e9cba2',light:'#f6e0c2',shade:'#cfa571',ink:'#3a2a1c',cheek:'#e08f6f',limb:'#dfba8c',foot:'#c79a62'},
 sumi:{name:'墨',body:'#413c36',light:'#5d574f',shade:'#27231f',ink:'#f3ece0',cheek:'#b9735e',limb:'#38342f',foot:'#27231f',dark:true}
};
const customPalette=h=>({name:'好きな色',body:hsl(h,34,91),light:hsl(h,46,96),shade:hsl(h,26,79),ink:hsl(h,24,14),cheek:hsl(h+8,68,76),limb:hsl(h,30,88),foot:hsl(h,24,83)});
/* The lamp is the character's identity colour. Amber is the colour of "waiting for you" and is never offered. */
const LAMPS={
 vermilion:{name:'朱',day:'#d4583a',night:'#ef7a58',glow:'239,122,88'},
 indigo:{name:'藍',day:'#3b5ba5',night:'#8fa8ea',glow:'110,140,230'},
 matcha:{name:'抹茶',day:'#5f8f4e',night:'#a5d18c',glow:'140,200,120'},
 plum:{name:'梅紫',day:'#8a4a7d',night:'#d093c4',glow:'200,130,190'},
 snow:{name:'雪',day:'#d9d0bd',night:'#fff6df',glow:'255,240,210'}
};
const themeOf=el=>el?.closest?.('[data-theme]')?.dataset.theme||document.documentElement.dataset.theme||'light';
const themeNow=()=>themeOf(document.body);
function resolvePalette(r,theme=themeNow()){
 let p=r.palette==='custom'?customPalette(r.hue??30):PALETTES[r.palette]||PALETTES.washi;
 if(theme!=='light'&&!p.dark){const k=c=>mix(c,'#cfc3ad',.22);p={...p,body:k(p.body),light:k(p.light),shade:k(p.shade),limb:k(p.limb),foot:k(p.foot)};}
 return p;
}
function paletteVars(r,theme=themeNow()){
 const p=resolvePalette(r,theme),L=LAMPS[r.lamp?.hue]||LAMPS.vermilion,lc=theme==='light'?L.day:L.night;

 else if(shape==='bud')body=`<ellipse class="lamp-dot" cx="${x}" cy="${y-1*k}" rx="${6*k}" ry="${8.4*k}"/><path d="M${x-5.5*k} ${y+4*k}Q${x} ${y+10*k} ${x+5.5*k} ${y+4*k}" fill="none" stroke="var(--c-ink)" stroke-opacity=".45" stroke-width="${2.2*k}" stroke-linecap="round"/><ellipse cx="${x-2*k}" cy="${y-4*k}" rx="${1.6*k}" ry="${2.6*k}" fill="#fff" opacity=".5"/>`;
 else if(shape==='bulb')body=`<rect x="${x-3.4*k}" y="${y+5*k}" width="${6.8*k}" height="${4*k}" rx="1.2" fill="var(--c-ink)" opacity=".7"/><circle class="lamp-dot" cx="${x}" cy="${y}" r="${7.2*k}"/><circle cx="${x-2.2*k}" cy="${y-2.4*k}" r="${1.9*k}" fill="#fff" opacity=".55"/>`;

/* ---- mounting and the small amount of life every body shares ---- */
const state={reduced:false,pointer:null};
function applyVars(svg,r){const v=paletteVars(r,themeOf(svg));for(const k in v)svg.style.setProperty(k,v[k]);svg.style.setProperty('--size',String(r.size||1));}
function mount(host,recipe,{mood='idle',follow=false,life=true}={}){
 const def=BODIES[recipe.body];if(!def)throw new Error('unknown body '+recipe.body);
 host.classList.add('cx-host');host.innerHTML=def.svg(recipe,uid());
 const svg=host.firstElementChild;svg.classList.add('cx',`cx-${def.id}`);svg.dataset.mood=mood;applyVars(svg,recipe);
 if(recipe.motion==='calm')svg.classList.add('m-calm');if(recipe.motion==='lively')svg.classList.add('m-lively');
 const h={host,svg,def,recipe,mood,follow,timers:[],ext:null,dead:false};ALL.add(h);
 const later=(fn,ms)=>{const t=setTimeout(()=>{if(!h.dead)fn();},ms);h.timers.push(t);};
 const look=(x,y)=>{svg.style.setProperty('--look-x',`${(x*5).toFixed(2)}px`);svg.style.setProperty('--look-y',`${(y*3.5).toFixed(2)}px`);svg.style.setProperty('--lk-x',(x).toFixed(3));svg.style.setProperty('--lk-y',(y).toFixed(3));h.ext?.look?.(x,y);};
 h.look=look;
 if(life){
  const blink=()=>{if(h.dead)return;if(h.mood!=='sleepy'&&h.mood!=='happy'&&!state.reduced){svg.classList.add('is-blinking');later(()=>svg.classList.remove('is-blinking'),130);if(Math.random()<.18)later(()=>{svg.classList.add('is-blinking');later(()=>svg.classList.remove('is-blinking'),120);},260);}later(blink,2200+Math.random()*4200);};
  later(blink,900+Math.random()*1200);
  const glance=()=>{if(h.dead)return;if(h.mood==='idle'&&!h.pointerHeld&&!state.reduced)look((Math.random()*2-1)*.7,(Math.random()*2-1)*.4);later(glance,5000+Math.random()*7000);};
  later(glance,3000+Math.random()*3000);
 }
 h.setMood=m=>{h.mood=m;svg.dataset.mood=m;if(m==='sleepy')look(0,.6);else if(m!=='idle')look(0,0);h.ext?.setMood?.(m);};
 h.setLevel=v=>{svg.style.setProperty('--mouth',String(.35+clamp(v,0,1)*.75));h.ext?.setLevel?.(v);};
 h.act=(name,ms=2600)=>{if(h.dead||state.reduced)return;svg.classList.add('act-'+name);later(()=>svg.classList.remove('act-'+name),ms);};
 h.destroy=()=>{h.dead=true;h.timers.forEach(clearTimeout);h.ext?.destroy?.();LIVE.delete(h);ALL.delete(h);};
 h.ext=def.init?.(svg,h)||null;
 if(follow)LIVE.add(h);
 h.setMood(mood);
 return h;
}
addEventListener('pointermove',e=>{
 state.pointer=[e.clientX,e.clientY];
 for(const h of LIVE){if(h.dead||state.reduced)continue;const r=h.host.getBoundingClientRect();if(!r.width)continue;
  const x=(e.clientX-(r.left+r.width/2))/Math.max(260,innerWidth/2),y=(e.clientY-(r.top+r.height*.45))/Math.max(220,innerHeight/2);
  h.pointerHeld=true;clearTimeout(h.pTimer);h.pTimer=setTimeout(()=>{h.pointerHeld=false;},4000);
  h.look(clamp(x,-1,1),clamp(y,-1,1));}
},{passive:true});
/** Re-apply colours when the page theme changes. */
function refreshThemes(){for(const h of ALL)if(!h.dead)applyVars(h.svg,h.recipe);}

/* ---- window light (web/daylight.mjs, pure) ---- */
const dayClamp=clamp,dayLerp=(a,b,t)=>a+(b-a)*t,dayMix=(a,b,t)=>a.map((v,i)=>Math.round(dayLerp(v,b[i],t)));
const SKY={clear:{sun:1,blur:[5,9],lines:[.1,.16],lamp:0},partly:{sun:.8,blur:[8,12],lines:[.09,.13],lamp:.04},cloud:{sun:.4,blur:[24,24],lines:[.03,.03],lamp:.08},fog:{sun:.3,blur:[30,30],lines:[.02,.02],lamp:.12},snow:{sun:.45,blur:[26,26],lines:[.02,.02],lamp:.1},rain:{sun:0,blur:[24,24],lines:[0,0],lamp:.22}};
const SKY_TINT={rain:'rgba(118,140,165,.09)',cloud:'rgba(140,140,140,.05)',fog:'rgba(170,170,170,.07)',snow:'rgba(200,220,245,.07)'};
const WEATHER_CODE={clear:0,partly:2,cloud:3,rain:61,snow:71};
const WEATHER_LABEL={clear:'晴れ',partly:'晴れ時々くもり',cloud:'くもり',rain:'雨',snow:'雪'};
function daylight(hour,sky){
 const rise=6,set=18,k=SKY[sky],t=dayClamp((hour-rise)/(set-rise),0,1),edge=Math.abs(t-.5)*2;
 const day=dayClamp(Math.min((hour-(rise-.3))/1.3,(set+.6-hour)/1.3),0,1);
 const color=t<.5?dayMix([255,248,234],[255,253,247],t*2):dayMix([255,253,247],[255,236,206],(t-.5)*2);
 const dusk=hour<rise-.5?1:dayClamp((hour-(set-.8))/2.4,0,1);

/* ===== C. 円相 (ensō): one brush stroke with a gap. The gap is the character: it turns to listen, opens to speak,
 * closes when something is finished. Drawn per frame so the brush can breathe. ===== */
(()=>{
const rad=d=>d*Math.PI/180,ss=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x);};
const CX=100,CY=118,R0=62,W0=15;
const MOODT={
 idle:{phi:135,gap:34,wob:1,thick:1,alpha:1},
 listening:{phi:92,gap:46,wob:1.2,thick:1,alpha:1},
 thinking:{phi:135,gap:26,wob:1.4,thick:.95,alpha:1},
 talking:{phi:92,gap:34,wob:1.2,thick:1.02,alpha:1},
 happy:{phi:135,gap:3,wob:.7,thick:1.1,alpha:1},
 attention:{phi:-38,gap:30,wob:1.1,thick:1.04,alpha:1},
 concerned:{phi:100,gap:58,wob:3.2,thick:.8,alpha:.92},
 sleepy:{phi:-90,gap:22,wob:.6,thick:.52,alpha:.58}
};
function geom(P,t){
 const N=150,sweep=360-P.gap,start=P.phi+P.gap/2,ph=P.seed,out=[],inn=[],mid=[];
 const nz=(x,k=0)=>Math.sin(x*1.7+ph+k)*.5+Math.sin(x*3.3+ph*1.7+k*2)*.3+Math.sin(x*7.1+ph*.6+k*3)*.2;
 for(let i=0;i<=N;i++){
  const u=i/N,th=rad(start+sweep*u);
  const load=(.55+.45*ss(0,.1,u))*(1+.28*(1-ss(0,.05,u))),fade=1-.86*ss(.58,1,u);
  const w=W0*P.thick*load*fade*(1+.07*nz(u*9,1)),r=R0*P.size+P.wob*1.5*nz(u*5+t*.15,2)-3.5*u+P.breath;
  const ro=r+w/2+.6*nz(u*40+t*.6,3),ri=r-w/2+.6*nz(u*37+t*.6,4);
  const c=Math.cos(th),s=Math.sin(th);
  out.push([CX+ro*c,CY+ro*s]);inn.push([CX+ri*c,CY+ri*s]);mid.push([CX+r*c,CY+r*s,w,th]);
 }
 const f=a=>a.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1));
 const d='M'+f(out).join('L')+'L'+f(inn.reverse()).join('L')+'Z';
 // dry-brush streaks (飛白) near the tail
 const sk=[[.62,-.28],[.56,.1],[.7,.3],[.48,-.05],[.76,-.12]],streaks=sk.map(([u0,off],k)=>{
  const pts=[];for(let i=Math.floor(u0*N);i<=N;i+=2){const m=mid[i];const rr=Math.hypot(m[0]-CX,m[1]-CY)+off*m[2];pts.push((CX+rr*Math.cos(m[3])).toFixed(1)+' '+(CY+rr*Math.sin(m[3])).toFixed(1));}
  return pts.length>2?`M${pts.join('L')}`:'';});
 return {d,streaks};
}
const E=new Set();let tk=0,last=0;
const quiet=()=>document.documentElement.classList.contains('rm')||matchMedia('(prefers-reduced-motion:reduce)').matches;
function loop(now){
 tk=requestAnimationFrame(loop);if(document.hidden||now-last<32)return;
 const dt=Math.min(.12,(now-last)/1000);last=now;for(const e of E)e(now/1000,dt);
}
defineBody({

  const eo={dot:`<ellipse cx="${100-g}" cy="116" rx="6.4" ry="7.8" transform="rotate(-8 ${100-g} 116)"/><ellipse cx="${100+g}" cy="116" rx="6.4" ry="7.8" transform="rotate(8 ${100+g} 116)"/>`,

   <g class="ec"><path d="M${100-g-8} 116Q${100-g} 122 ${100-g+8} 116"/><path d="M${100+g-8} 116Q${100+g} 122 ${100+g+8} 116"/></g></g>

 },

  const ring=svg.querySelector('.ring-mask'),streaks=svg.querySelector('.streaks'),size=h.recipe.size||1;
  const brush={thin:.74,mid:1,bold:1.3}[h.recipe.slots?.brush||'mid']||1;
  const cur={phi:135,gap:34,wob:1,thick:brush,alpha:1},seed=Math.random()*10;let spin=0,tgt={...MOODT.idle,thick:brush},mood='idle',level=0,off=false;
  const draw=(t,boil)=>{const g=geom({phi:cur.phi+spin,gap:cur.gap,wob:cur.wob,thick:cur.thick,size:1,breath:boil,seed},t);ring.setAttribute('d',g.d);streaks.innerHTML=g.streaks.map(d=>d?`<path d="${d}"/>`:'').join('');svg.style.setProperty('--ink-a',cur.alpha.toFixed(2));};
  const step=(t,dt)=>{
   if(off)return;
   const q=quiet();
   if(mood==='thinking'&&!q)spin+=dt*46;else if(mood!=='thinking')spin*=Math.exp(-4*dt);
   let T=tgt;if(mood==='talking')T={...tgt,gap:20+34*(.5+.5*Math.sin(t*9+Math.sin(t*3)))*(.4+level*.6)};
   const k=q?1:1-Math.exp(-6*dt);
   for(const key of ['phi','gap','wob','thick','alpha']){let d=T[key]-cur[key];if(key==='phi'){d=((d+540)%360)-180;}cur[key]+=d*k;}
   draw(q?0:Math.floor(t*6)/6,q?0:Math.sin(t*1.3)*.9);
  };
  draw(0,0);E.add(step);if(!tk)tk=requestAnimationFrame(loop);
  return {
   setMood(m){mood=m;tgt={...(MOODT[m]||MOODT.idle)};tgt.thick*=brush;if(m==='thinking')spin=spin%360;},
   setLevel(v){level=v;},
   destroy(){off=true;E.delete(step);}
  };
 }
});
})();

/* ===== G. 苔玉 (kokedama): a moss ball with a sprout whose bud is the lamp. It leans toward the window, folds its leaves at night,
 * and changes leaf colour with the season. ===== */
(()=>{
const seasonLeaf=()=>{const m=new Date().getMonth()+1;return m>=3&&m<=5?['#a9c68c','#7fa066']:m>=6&&m<=8?['#6f9a55','#4f7a3e']:m>=9&&m<=11?['#c9954f','#a4692f']:['#8aa27c','#667f5a'];};
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const LEAF_L='M101 86C86 90 70 82 62 64C80 58 98 68 101 86Z',LEAF_R=mirrorPath('M101 86C86 90 70 82 62 64C80 58 98 68 101 86Z').replace(/^M99/,'M99');
const LEAF_SM_L='M102 68C96 67 91 62 90 55C97 55 101 60 102 68Z';
const fuzz=(seed)=>{const R=rng(seed),o=[];for(let i=0;i<110;i++){const a=R()*Math.PI*2,d=Math.sqrt(R())*44,x=100+Math.cos(a)*d,y=160+Math.sin(a)*d,rx=2.2+R()*2.6,ry=1.5+R()*1.6,rot=Math.floor(R()*180),dark=R()<.45;
 o.push(`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" transform="rotate(${rot} ${x.toFixed(1)} ${y.toFixed(1)})" fill="${dark?'var(--c-shade)':'var(--c-light)'}" opacity="${dark?.55:.5}"/>`);}return o.join('');};
defineBody({
 id:'kokedama',name:'苔玉',kana:'Kokedama',tag:'いきものではない相棒',
 pitch:'苔玉の芽の先が、そのままランプの蕾。窓の光のほうへ首を傾け、夜は葉を閉じ、季節で葉の色が変わります。仕事が見直し待ちになると蕾がひらきます。',
 traits:['静か','季節','窓辺に置く'],
 palette:'moss',lampShape:'bud',eyes:'dot',
 slots:[
  {key:'leaves',label:'葉の色',opts:[['auto','季節にまかせる'],['spring','春'],['summer','夏'],['autumn','秋'],['winter','冬']]},
  {key:'faceVis',label:'顔',opts:[['always','いつも'],['never','出さない']]}
 ],
 svg(r,u){
  const lampShape=r.lamp?.shape||'bud',g=14,fv=r.slots?.faceVis||'always',leaves=r.slots?.leaves&&r.slots.leaves!=='auto'?r.slots.leaves:null;
  const LC=leaves?{spring:['#a9c68c','#7fa066'],summer:['#6f9a55','#4f7a3e'],autumn:['#c9954f','#a4692f'],winter:['#8aa27c','#667f5a']}[leaves]:seasonLeaf();
  const A={top:[100,114],headW:84,headH:50,face:[100,160],eyeGap:g,handR:[144,176],neck:[100,184,40]};
  return `<svg viewBox="0 0 200 224" class="face-${fv}" aria-hidden="true" focusable="false" style="--leaf:${LC[0]};--leaf-d:${LC[1]}">
 <defs>
  <radialGradient id="${u}-b" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="var(--c-light)"/><stop offset=".45" stop-color="var(--c-body)"/><stop offset="1" stop-color="var(--c-shade)"/></radialGradient>
  <clipPath id="${u}-c"><circle cx="100" cy="160" r="46"/></clipPath>${lampDefs(u)}
 </defs>
 <ellipse class="floor" cx="100" cy="212" rx="62" ry="7"/>
 <g class="pose"><g class="breath">
  <ellipse class="dish" cx="100" cy="205" rx="60" ry="10"/><ellipse class="dish-in" cx="100" cy="203" rx="52" ry="6.5"/>
  <g class="sprout" style="--ox:100px;--oy:120px"><g class="sway" style="--ox:100px;--oy:120px">
   <path class="stem" d="M100 122C97 108 104 96 101 82C99.5 74 101 68 102 60"/>
   <g class="leaf leaf-l" style="--ox:101px;--oy:86px"><path class="leaf-b" d="${LEAF_L}"/><path class="leaf-v" d="M101 86C90 80 76 72 66 64"/></g>
   <g class="leaf leaf-r" style="--ox:99px;--oy:86px"><path class="leaf-b" d="${LEAF_R}"/><path class="leaf-v" d="${mirrorPath('M101 86C90 80 76 72 66 64')}"/></g>
   <g class="leaf leaf-sl" style="--ox:102px;--oy:68px"><path class="leaf-b" d="${LEAF_SM_L}"/></g>

 const v=defaultRecipe(body),def=BODIES[body];
 const pick=(label,val,list,fallback)=>{if(val===undefined)return fallback;if(list.includes(val))return val;errors.push(`${label} は ${list.join(' / ')} のどれかです。`);return fallback;};
 v.palette=pick('palette',raw.palette,ENUM.palette,v.palette);
 if(raw.hue!==undefined){if(typeof raw.hue==='number'&&raw.hue>=0&&raw.hue<=360)v.hue=raw.hue;else errors.push('hue は 0〜360 の数です。');}
 if(raw.lamp!==undefined){if(raw.lamp&&typeof raw.lamp==='object'){
   v.lamp.hue=pick('lamp.hue',raw.lamp.hue,ENUM.lampHue,v.lamp.hue);

   v.lamp.shape=pick('lamp.shape',raw.lamp.shape,ENUM.lampShape,v.lamp.shape);
  }else errors.push('lamp はオブジェクトです。');}
 if(raw.face!==undefined){if(raw.face&&typeof raw.face==='object'){
   v.face.eyes=pick('face.eyes',raw.face.eyes,ENUM.eyes,v.face.eyes);
   for(const k of ['cheeks','brows'])if(raw.face[k]!==undefined){if(typeof raw.face[k]==='boolean')v.face[k]=raw.face[k];else errors.push(`face.${k} は true / false です。`);}
  }else errors.push('face はオブジェクトです。');}
 if(raw.parts!==undefined){if(raw.parts&&typeof raw.parts==='object')v.parts.ears=pick('parts.ears',raw.parts.ears,ENUM.ears,v.parts.ears);else errors.push('parts はオブジェクトです。');}
 if(raw.props!==undefined){if(raw.props&&typeof raw.props==='object'){v.props.season=pick('props.season',raw.props.season,ENUM.season,v.props.season);v.props.hobby=pick('props.hobby',raw.props.hobby,ENUM.hobby,v.props.hobby);}else errors.push('props はオブジェクトです。');}
 if(raw.slots!==undefined){if(raw.slots&&typeof raw.slots==='object'){
   for(const [k,val] of Object.entries(raw.slots)){const slot=(def.slots||[]).find(s=>s.key===k&&!s.face);if(!slot){errors.push(`この体に「${k}」の設定はありません。`);continue;}

 if(raw.size!==undefined){if(typeof raw.size==='number'&&raw.size>=.8&&raw.size<=1.25)v.size=raw.size;else errors.push('size は 0.8〜1.25 の数です。');}
 v.motion=pick('motion',raw.motion,ENUM.motion,v.motion);
 return {ok:!errors.length,errors,value:v};
}

const defaultStyle=()=>({palette:'washi',hue:30,lamp:{hue:'vermilion',shape:'bead'},props:{season:'off',hobby:'none'},size:1,motion:'normal'});
/** One person's recipe for body (their personal style carries across bodies; body-specific parts are remembered per body). */
function getRecipe(body=S.body){
 const d=defaultRecipe(body),per=S.per[body]||(S.per[body]={slots:{},face:{...d.face},parts:{...d.parts}});
 return {...d,body,palette:S.touched.palette?S.style.palette:d.palette,hue:S.style.hue,
  lamp:{hue:S.style.lamp.hue,shape:S.touched.shape?S.style.lamp.shape:d.lamp.shape},
  face:{...per.face},parts:{...per.parts},props:{...S.style.props},slots:{...per.slots},size:S.style.size,motion:S.style.motion};
}
function applyRecipe(v){
 S.body=v.body;S.style.palette=v.palette;S.touched.palette=true;S.style.hue=v.hue;S.style.lamp={hue:v.lamp.hue,shape:v.lamp.shape};S.touched.shape=true;
 S.style.props={...v.props};S.style.size=v.size;S.style.motion=v.motion;S.per[v.body]={slots:{...v.slots},face:{...v.face},parts:{...v.parts}};
 syncAll();
}
function randomRecipe(){
 const bodies=ORDER.filter(i=>i!=='legacy'&&i!=='image'),body=bodies[Math.floor(Math.random()*bodies.length)],d=defaultRecipe(body),def=BODIES[body],R=a=>a[Math.floor(Math.random()*a.length)];
 const v={...d,body,palette:R(ENUM.palette.filter(p=>p!=='custom')),hue:Math.floor(Math.random()*360),lamp:{hue:R(ENUM.lampHue.filter(h=>h!=='snow')),shape:R(ENUM.lampShape)},
  face:{eyes:R(ENUM.eyes),cheeks:Math.random()>.2,brows:Math.random()>.25},parts:{ears:EARS_BODIES.includes(body)?R(ENUM.ears):'none'},
  props:{season:R(ENUM.season),hobby:R(ENUM.hobby)},slots:{},size:S.style.size,motion:S.style.motion};
 if(Math.random()>.7){v.palette='custom';}
 for(const s of def.slots||[]){if(s.face){v.face.eyes=R(s.opts)[0];}else v.slots[s.key]=R(s.opts)[0];}
 if(v.palette==='sumi'&&['andon','kokedama'].includes(body))v.palette='washi';
 return v;
}
const hueOf=hex=>{const [r,g,b]=hex2rgb(hex).map(v=>v/255),mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;if(!d)return 0;let h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;return (h*60+360)%360;};

function setByKey(key,val){
 const per=S.per[S.body]||(S.per[S.body]={slots:{},face:{...defaultRecipe(S.body).face},parts:{...defaultRecipe(S.body).parts}});
 if(key==='body'){selectBody(val);return;}
 if(key==='palette'){S.style.palette=val;S.touched.palette=true;}
 else if(key==='lamp.hue')S.style.lamp.hue=val;
 else if(key==='lamp.shape'){S.style.lamp.shape=val;S.touched.shape=true;}
 else if(key==='face.eyes')per.face.eyes=val;
 else if(key==='face.cheeks')per.face.cheeks=val;
 else if(key==='face.brows')per.face.brows=val;
 else if(key==='parts.ears')per.parts.ears=val;
 else if(key==='props.season')S.style.props.season=val;
 else if(key==='props.hobby')S.style.props.hobby=val;
 else if(key==='motion')S.style.motion=val;
 else if(key.startsWith('slot.'))per.slots[key.slice(5)]=val;
 syncAll();
}
