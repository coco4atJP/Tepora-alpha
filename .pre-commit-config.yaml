# Tepora Quality Gates - Pre-commit Configuration
# https://pre-commit.com/
#
# Installation:
#   pip install pre-commit
#   pre-commit install --hook-type pre-commit --hook-type pre-push
#
# Manual run:
#   pre-commit run --hook-stage pre-commit
#   pre-commit run --hook-stage pre-push --all-files

default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  # General checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit, pre-push]
      - id: end-of-file-fixer
        stages: [pre-commit, pre-push]
      - id: check-yaml
        stages: [pre-commit, pre-push]
      - id: check-json
        stages: [pre-commit, pre-push]
      - id: check-toml
        stages: [pre-commit, pre-push]
      - id: check-added-large-files
        args: ['--maxkb=1000']
        stages: [pre-commit, pre-push]
      - id: check-merge-conflict
        stages: [pre-commit, pre-push]
      - id: mixed-line-ending
        args: ['--fix=lf']
        stages: [pre-commit, pre-push]
      - id: detect-private-key
        stages: [pre-commit, pre-push]

  # V3 checks; core validation needs no npm runtime dependencies.
  - repo: local
    hooks:
      - id: tepora-v3-syntax
        name: Tepora V3 JavaScript syntax
        entry: npm run check
        language: system
        files: ^(Tepora-v3/|scripts/|tests/|package\.json)
        pass_filenames: false
        stages: [pre-commit]
      - id: tepora-v3-quality
        name: Tepora V3 regression gate
        entry: npm run quality
        language: system
        files: ^(Tepora-v3/|scripts/|tests/|package\.json)
        pass_filenames: false
        stages: [pre-push]

  # Secrets detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        exclude: package-lock\.json|uv\.lock
        stages: [pre-commit, pre-push]

# CI-specific settings
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks
  autofix_prs: true
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: [tepora-v3-syntax, tepora-v3-quality]  # Run in V3 CI with Node/Python
