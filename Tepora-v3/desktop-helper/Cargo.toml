[package]
name = "tepora-desktop-helper"
version = "3.0.0-beta.11"
edition = "2021"
license = "Apache-2.0"
description = "Tepora desktop-control helper for Windows (UI Automation + SendInput) and Linux X11 (AT-SPI + XTest)"
publish = false

[[bin]]
name = "tepora-desktop-helper"
path = "src/main.rs"

[dependencies]
serde_json = "1"
base64 = "=0.23.1"
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["xtest"] }
serde = "1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
