# Default commands for Tepora 3.0.0-beta.11.
version: '3'

tasks:
  default:
    desc: List Tepora V3 tasks
    cmds: ['task --list']
  dev:
    desc: Start the V3 service and open its authenticated browser UI
    cmds: ['npm start']
  serve:
    desc: Start V3 without opening a browser
    cmds: ['npm run serve']
  dev-tauri:
    desc: Start the V3 Tauri desktop host
    cmds: ['npm run desktop']
  install:
    desc: Install the optional V3 native build dependencies
    cmds: ['npm ci --prefix Tepora-v3 --ignore-scripts']
  doctor:
    desc: Check the V3 development environment
    cmds: ['npm run doctor']
  test:
    desc: Run V3 Node tests and repository entry-point tests
    cmds: ['npm test']
  test:workers:
    desc: Run isolated Python worker contracts
    cmds: ['npm run test:workers']
  test:scenarios:
    desc: Check references for the 100 scenarios
    cmds: ['npm run test:scenarios']
  test:capabilities:
    desc: Run capability integration with local deterministic fixtures
    cmds: ['npm run test:capabilities']
  test:computer:
    desc: Check the optional installed browser worker
    cmds: ['npm run test:computer']
  lint:
    desc: Check JavaScript syntax
    cmds: ['npm run check']
  quality:
    desc: Run the V3 regression gate and capability fixtures
    cmds: ['npm run quality']
  quality:full:
    desc: Add optional browser UI and computer checks
    cmds: ['npm run quality:full']
  pre-commit:
    desc: Check source syntax before committing
    cmds: ['npm run check']
  pre-commit:full:
    desc: Run all standard regression gates before pushing
    cmds: ['npm run quality']
  build:
    desc: Build the V3 native desktop package
    cmds: ['npm run build']
  package:
    desc: Build the V3 native desktop package
    cmds: ['npm run build']
  build-sidecar:
    desc: Prepare the V3 Node sidecar and source resources
    cmds: ['npm run build:sidecar']
  preview:
    desc: Generate the model-free beta.11 UI preview
    cmds: ['npm run preview:build']
  release-notes:
    desc: Generate release notes from Git commits
    cmds: ['npm run release-notes -- {{.CLI_ARGS}}']
  commitlint:
    desc: Check conventional commit messages in an explicit range
    cmds: ['npm run commitlint -- {{.CLI_ARGS}}']
