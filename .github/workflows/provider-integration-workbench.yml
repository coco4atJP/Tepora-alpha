name: Provider integration workbench
on:
  push:
    branches: ['work/v3-provider-auth-20261016']
    paths: ['.github/workflows/provider-integration-workbench.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Apply final reviewed cancellation and HTTP regression delta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          sha = 'a441039f608b6577ead2914fccd82f43d5fc586f'
          req = urllib.request.Request('https://api.github.com/repos/coco4atJP/Tepora-alpha/git/blobs/'+sha, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)
          assert data['sha'] == sha and data['encoding'] == 'base64'
          patch = lzma.decompress(base64.b64decode(base64.b64decode(data['content']),validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'fd66ebb3aed383aa2913f86f109e16579c0bce00d3fff5448a853b89f5961ce7'
          p = pathlib.Path(os.environ['RUNNER_TEMP'])/'provider-final.patch'
          p.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply','--index',str(p)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - run: npm run build:core
      - name: Auth, real HTTP host and shared Rust codec integration
        run: node --test Tepora-v3/tests/provider-auth.test.mjs Tepora-v3/tests/provider-auth-http.test.mjs Tepora-v3/tests/provider-chatgpt-protocol.test.mjs
      - run: node Tepora-v3/scripts/check.mjs
      - name: Stage validated final source on isolated branch
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'Tepora development assistant'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m "test(providers): verify real HTTP auth flow and cancel startup safely"
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          test "$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin refs/heads/work/v3-provider-auth-20261016 | cut -f1)" = "$GITHUB_SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/work/v3-provider-auth-20261016
