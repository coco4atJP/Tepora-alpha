name: Tepora V3 dependency health
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:
  pull_request:
    paths: ['Tepora-v3/package*.json', '.github/workflows/dependency-peer-health.yml']
permissions:
  contents: read
jobs:
  dependency-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: Tepora-v3/package-lock.json
      - name: Install locked native CLI dependencies
        run: npm ci --prefix Tepora-v3 --ignore-scripts
      - name: Check dependency resolution
        run: npm ls --prefix Tepora-v3
