name: Tepora V3 beta.11 native artifact smoke
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful V3 native build run containing the artifacts
        required: true
        type: string
      source_ref:
        description: Exact full source commit SHA matching that artifact run
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: Verify artifact source identity
        uses: actions/github-script@v7
        env:
          ARTIFACT_RUN_ID: ${{ inputs.run_id }}
          SOURCE_REF: ${{ inputs.source_ref }}
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const sha = execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
            if (!/^[0-9a-f]{40}$/.test(process.env.SOURCE_REF) || sha !== process.env.SOURCE_REF) {
              throw new Error('A matching full commit SHA is required.');
            }
            if (!/^\d+$/.test(process.env.ARTIFACT_RUN_ID)) throw new Error('Invalid run ID.');
            const {data: run} = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo,
              run_id: Number(process.env.ARTIFACT_RUN_ID)
            });
            if (run.head_sha !== sha || run.conclusion !== 'success' ||
                run.path !== '.github/workflows/tepora-v3-beta.yml') {
              throw new Error('Artifacts must come from a successful V3 native build of this exact commit.');
            }
      - uses: actions/download-artifact@v4
        with:
          name: tepora-v3-${{ matrix.os }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: Tepora-v3
      - name: Install and launch Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: Tepora-v3
        run: |
          $env:GITHUB_SHA = (git rev-parse HEAD).Trim()
          ./ci/native-smoke.ps1
      - name: Copy and launch macOS package
        if: runner.os == 'macOS'
        shell: bash
        working-directory: Tepora-v3
        run: |
          export GITHUB_SHA="$(git rev-parse HEAD)"
          bash ci/native-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tepora-v3-native-smoke-${{ matrix.os }}
          path: Tepora-v3/.qa-native/
          include-hidden-files: true
          if-no-files-found: warn
