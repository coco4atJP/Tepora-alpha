name: Tepora V3 dependency security scan
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: Tepora-v3/package-lock.json
      - run: npm ci --prefix Tepora-v3 --ignore-scripts
      - run: npm audit --prefix Tepora-v3
  cargo-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tepora-v3/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
