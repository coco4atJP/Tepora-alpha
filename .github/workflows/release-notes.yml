name: Tepora V3 release notes
on:
  push:
    tags: ['v3.*']
  workflow_dispatch:
    inputs:
      from:
        description: Optional start ref
        required: false
        type: string
      to:
        description: Optional end ref
        required: false
        type: string
      version:
        description: Optional release label
        required: false
        type: string
permissions:
  contents: read
jobs:
  generate-release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Generate release notes
        env:
          START_REF: ${{ inputs.from }}
          END_REF: ${{ inputs.to }}
          RELEASE_LABEL: ${{ inputs.version }}
        shell: bash
        run: |
          start_ref="$START_REF"
          end_ref="${END_REF:-$GITHUB_REF_NAME}"
          label="$RELEASE_LABEL"
          if [ -z "$label" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then label="$GITHUB_REF_NAME"; else label="3.0.0-beta.11"; fi
          fi
          if [ -z "$start_ref" ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            start_ref=$(git describe --tags --match 'v3.*' --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          fi
          args=(--to "$end_ref" --version "$label" --output "$RUNNER_TEMP/release-notes.md")
          if [ -n "$start_ref" ]; then args+=(--from "$start_ref"); fi
          npm run release-notes -- "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: tepora-v3-release-notes
          path: ${{ runner.temp }}/release-notes.md
      - name: Append notes to summary
        run: cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"
