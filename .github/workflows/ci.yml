name: Tepora V3 beta.11 regression
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'Tepora-v3/**'
      - 'scripts/*.mjs'
      - 'tests/**'
      - 'package*.json'
      - 'Taskfile.yml'
      - 'start.*'
      - 'README.md'
      - 'TEPORA_V3_BETA.md'
      - 'docs/**'
      - '.github/workflows/ci.yml'
      - '.pre-commit-config.yaml'
  pull_request:
    paths:
      - 'Tepora-v3/**'
      - 'scripts/*.mjs'
      - 'tests/**'
      - 'package*.json'
      - 'Taskfile.yml'
      - 'start.*'
      - 'README.md'
      - 'TEPORA_V3_BETA.md'
      - 'docs/**'
      - '.github/workflows/ci.yml'
      - '.pre-commit-config.yaml'
permissions:
  contents: read
concurrency:
  group: tepora-v3-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Install pinned V3 SDK dependencies
        run: npm ci --prefix "${{ github.workspace }}/Tepora-v3" --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bound Windows Rust test parallelism
        if: runner.os == 'Windows'
        run: echo "RUST_TEST_THREADS=2" >> "$GITHUB_ENV"
      - run: rustup default stable
      # quality already runs Rust builds/tests, Node/Python tests and preview checks.
      - name: V3 regression gate
        env:
          PYTHON: python
        run: npm run quality
      - name: Offline monitor and layout browser regressions
        if: runner.os == 'Linux'
        working-directory: Tepora-v3
        run: |
          node tests/browser-monitor.mjs
          node tests/browser-ui-layout.mjs
      # Desktop control on a real X11 display + AT-SPI bus (helper unit tests already run inside quality).
      - name: Desktop helper X11 / AT-SPI smoke
        if: runner.os == 'Linux'
        working-directory: Tepora-v3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb at-spi2-core libgtk-3-0 dbus gcc
          cargo build --release --locked --manifest-path desktop-helper/Cargo.toml
          dbus-run-session -- desktop-helper/smoke/run-x11-smoke.sh
      - name: Validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tepora-v3-regression-${{ matrix.os }}
          path: Tepora-v3/validation/
          if-no-files-found: warn
