name: Tepora V3 beta.11 regression
on:
  workflow_dispatch:
  push:
    branches: ['rust/v3-core-migration']
    paths:
      - 'Tepora-v3/**'
      - 'scripts/*.mjs'
      - 'tests/**'
      - 'package*.json'
      - 'Taskfile.yml'
      - 'start.*'
      - 'README.md'
      - 'TEPORA_V3_BETA.md'
      - 'docs/**'
      - '.github/workflows/ci.yml'
      - '.pre-commit-config.yaml'
  pull_request:
    paths:
      - 'Tepora-v3/**'
      - 'scripts/*.mjs'
      - 'tests/**'
      - 'package*.json'
      - 'Taskfile.yml'
      - 'start.*'
      - 'README.md'
      - 'TEPORA_V3_BETA.md'
      - 'docs/**'
      - '.github/workflows/ci.yml'
      - '.pre-commit-config.yaml'
permissions:
  contents: read
concurrency:
  group: tepora-v3-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    # The canonical V3 branch is checked at its exact push SHA, even when the PR
    # head ref is delayed. Avoid running the same matrix twice on PR sync.
    if: github.event_name != 'pull_request' || github.head_ref != 'rust/v3-core-migration'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Install pinned V3 SDK dependencies
        run: npm ci --prefix "${{ github.workspace }}/Tepora-v3" --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bound Windows Rust test parallelism
        if: runner.os == 'Windows'
        run: echo "RUST_TEST_THREADS=2" >> "$GITHUB_ENV"
      - run: rustup default stable
      - name: Rust persistence tests
        run: npm run test:rust
      - name: V3 regression gate
        env:
          PYTHON: python
        run: npm run quality
      - name: Offline monitor, layout and pending playback regressions
        if: runner.os == 'Linux'
        working-directory: Tepora-v3
        run: |
          node tests/browser-monitor.mjs
          node tests/browser-ui-layout.mjs
          node tests/browser-pending-play.mjs "$RUNNER_TEMP/tepora-pending-play"
      - name: Failed regression stage diagnostics
        if: failure()
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          import json, pathlib, re, uuid
          root = pathlib.Path('Tepora-v3/validation/loop').resolve()
          report_path = root / 'latest.json'
          if not report_path.is_file():
              print('No improve-loop report; failure occurred before stage reporting.')
              raise SystemExit(0)
          report = json.loads(report_path.read_text(encoding='utf-8'))
          print(json.dumps({key: report.get(key) for key in ('passed', 'stable', 'results')}, indent=2))
          folder = pathlib.Path(report['folder']).resolve()
          if not folder.is_relative_to(root):
              raise SystemExit('Refusing a stage log outside the validation folder')
          token = 'stage-log-' + uuid.uuid4().hex
          print('::stop-commands::' + token, flush=True)
          try:
              for stage in report.get('results', []):
                  if stage.get('code') == 0:
                      continue
                  log = (folder / (stage['name'] + '.log')).resolve()
                  if not log.is_relative_to(folder) or not log.is_file():
                      continue
                  print('Failed stage log: ' + stage['name'])
                  lines = log.read_text(encoding='utf-8', errors='replace').splitlines()
                  subtest, failures = None, 0
                  for index, line in enumerate(lines):
                      if re.match(r'^\s*# Subtest:', line):
                          subtest = line
                      if not re.match(r'^\s*not ok ', line):
                          continue
                      failures += 1
                      if failures > 10:
                          print('Additional TAP failure blocks omitted.')
                          break
                      print('TAP failure block ' + str(failures))
                      if subtest is not None:
                          print(subtest)
                      for offset, detail in enumerate(lines[index:index + 61]):
                          if offset and re.match(r'^(?:# Subtest:|(?:not )?ok \d+)', detail):
                              break
                          print(detail)
                  print('Last 180 log lines:')
                  print('\n'.join(lines[-180:]), flush=True)
          finally:
              print('::' + token + '::', flush=True)
          PY
      - name: Validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tepora-v3-regression-${{ matrix.os }}
          path: |
            Tepora-v3/validation/
            ${{ runner.temp }}/tepora-pending-play/
          if-no-files-found: warn
