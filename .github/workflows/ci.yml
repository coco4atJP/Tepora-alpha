name: Tepora V3 beta.11 regression
on:
  workflow_dispatch:
  push:
    branches: [main, 'v3.0-beta/**']
    paths:
      - 'Tepora-v3/**'
      - 'scripts/*.mjs'
      - 'tests/**'
      - 'package*.json'
      - 'Taskfile.yml'
      - 'start.*'
      - 'README.md'
      - 'TEPORA_V3_BETA.md'
      - 'docs/**'
      - '.github/workflows/ci.yml'
      - '.pre-commit-config.yaml'
  pull_request:
    paths:
      - 'Tepora-v3/**'
      - 'scripts/*.mjs'
      - 'tests/**'
      - 'package*.json'
      - 'Taskfile.yml'
      - 'start.*'
      - 'README.md'
      - 'TEPORA_V3_BETA.md'
      - 'docs/**'
      - '.github/workflows/ci.yml'
      - '.pre-commit-config.yaml'
permissions:
  contents: read
concurrency:
  group: tepora-v3-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: V3 regression gate
        env:
          PYTHON: python
        run: npm run quality
      - name: Validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tepora-v3-regression-${{ matrix.os }}
          path: Tepora-v3/validation/
          if-no-files-found: warn
