name: Pi AI integration workbench
on:
  push:
    branches: ['work/v3-pi-ai-20261016']
    paths: ['.github/workflows/pi-ai-workbench.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RUST_TEST_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply exact reviewed pi-ai source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          parts = ['0cf84fe6726703f37cbead42a6192aeea12e0f6e', 'b05d5e0ecd4d9827ac97c61c37768d9df20e7d3d', '58626c94c65b88f26b2c3404052c92648374a654', '28f74d2dda7377a4dacf0a57c973895a0b87007a', 'bbd324fea8e0e195a25d302416ff7179cd21651c', '8fedc0c4febf0e6193d2c2dac40df71f28ac2de3', '89e1cff25aa689e390109a1fca07eb7dcc834b1e', '7d43c2fef4a51a8b7e0be55ab44bbdcf0044313c']
          encoded = b''
          for sha in parts:
              req = urllib.request.Request('https://api.github.com/repos/coco4atJP/Tepora-alpha/git/blobs/'+sha, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)
              assert data['sha'] == sha and data['encoding'] == 'base64'
              encoded += base64.b64decode(data['content'])
          assert hashlib.sha256(encoded).hexdigest() == '41db7215f9f41382949efc41bf55995d05e81b07016b73ca1f8dfd0aa52c94b9'
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'ada0bad11e5eb2949358d3df702b0d3d8075c1841472a30661f828ce38c4572c'
          p = pathlib.Path(os.environ['RUNNER_TEMP'])/'pi-ai-integration.patch'
          p.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply','--index',str(p)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','diff','--cached','--stat'],check=True)
          PY
      - run: npm ci --prefix Tepora-v3 --ignore-scripts
      - run: rustup default stable
      - name: Full shared Rust, native host, Node and worker regression gate
        env:
          PYTHON: python
        run: npm run quality
      - name: Preserve validated source identity
        run: |
          git diff --cached --check
          git write-tree > "$RUNNER_TEMP/pi-ai-validated-tree.txt"
          git diff --cached --stat > "$RUNNER_TEMP/pi-ai-validated-stat.txt"
      - name: Stage validated pi-ai implementation on isolated branch
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'Tepora development assistant'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "feat(providers): integrate real pi-ai catalog, inference and multi-provider OAuth"
          git rev-parse HEAD > "$RUNNER_TEMP/pi-ai-validated-commit.txt"
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          test "$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin refs/heads/work/v3-pi-ai-20261016 | cut -f1)" = "$GITHUB_SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/work/v3-pi-ai-20261016
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tepora-pi-ai-validation
          path: |
            Tepora-v3/validation/
            ${{ runner.temp }}/pi-ai-validated-tree.txt
            ${{ runner.temp }}/pi-ai-validated-commit.txt
            ${{ runner.temp }}/pi-ai-validated-stat.txt
          if-no-files-found: ignore
          retention-days: 1
