name: Pi AI integration workbench
on:
  push:
    branches: ['work/v3-pi-ai-integration-20261016']
    paths: ['.github/workflows/pi-ai-workbench.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Apply final UI refinement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          sha = '82665af7ad1b31ccb16fdf9e50ea8e7b5b15fe3a'
          req = urllib.request.Request('https://api.github.com/repos/coco4atJP/Tepora-alpha/git/blobs/'+sha, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)
          assert data['sha'] == sha and data['encoding'] == 'base64'
          patch = lzma.decompress(base64.b64decode(base64.b64decode(data['content']), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '51cc4a527a0a61f9c90604358c1318ce18a4872bbcbe9a4fa4407df19bb9c72b'
          p = pathlib.Path(os.environ['RUNNER_TEMP'])/'pi-ai-ui.patch'
          p.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply','--index',str(p)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - run: npm ci --prefix Tepora-v3 --ignore-scripts
      - run: npm run build:core
      - name: Actual SDK authentication, streaming, HTTP and packaging regressions
        run: node --test --test-timeout=120000 Tepora-v3/tests/pi-ai.test.mjs Tepora-v3/tests/pi-ai-http.test.mjs Tepora-v3/tests/pi-packaging.test.mjs
      - run: node Tepora-v3/scripts/check.mjs
      - run: node Tepora-v3/scripts/build-preview.mjs
      - name: Commit validated UI refinement
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'Tepora development assistant'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git diff --exit-code
          git commit -m "fix(v3): preserve pi-ai login cancellation and readable mobile account cards"
          git rev-parse HEAD > "$RUNNER_TEMP/validated-commit.txt"
          git rev-parse HEAD^{tree} >> "$RUNNER_TEMP/validated-commit.txt"
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          test "$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin refs/heads/work/v3-pi-ai-integration-20261016 | cut -f1)" = "$GITHUB_SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/work/v3-pi-ai-integration-20261016
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi-ai-final-validation
          path: ${{ runner.temp }}/validated-commit.txt
          if-no-files-found: warn
          retention-days: 2
