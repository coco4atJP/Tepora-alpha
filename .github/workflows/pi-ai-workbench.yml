name: Pi AI integration workbench
on:
  push:
    branches: ['work/v3-pi-ai-20261016']
    paths: ['.github/workflows/pi-ai-workbench.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve the real pi-ai dependency and export development sources
        run: |
          npm install --prefix Tepora-v3 --ignore-scripts --save-exact @earendil-works/pi-ai@1.3.0
          node --input-type=module - <<'JS'
          import {builtinModels} from './Tepora-v3/node_modules/@earendil-works/pi-ai/dist/providers/all.js';
          const models=builtinModels();
          console.log('providers',models.getProviders().map(p=>({id:p.id,auth:Object.keys(p.auth||{})})));
          console.log('model count',models.getModels().length);
          JS
          git archive --format=tar.gz --output="$RUNNER_TEMP/source.tar.gz" HEAD
          tar -czf "$RUNNER_TEMP/pi-ai-deps.tar.gz" Tepora-v3/package.json Tepora-v3/package-lock.json Tepora-v3/node_modules
          cp "$(command -v node)" "$RUNNER_TEMP/node"
      - uses: actions/upload-artifact@v4
        with:
          name: tepora-pi-ai-environment
          path: |
            ${{ runner.temp }}/source.tar.gz
            ${{ runner.temp }}/pi-ai-deps.tar.gz
            ${{ runner.temp }}/node
          retention-days: 1
