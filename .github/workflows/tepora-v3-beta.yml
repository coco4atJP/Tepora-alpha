name: Tepora V3 beta.11 native build
on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v3.*']
    paths: ['Tepora-v3/**', 'package*.json', '.github/workflows/tepora-v3-beta.yml']
  pull_request:
    paths: ['Tepora-v3/**', 'package*.json', '.github/workflows/tepora-v3-beta.yml']
permissions:
  contents: read
concurrency:
  group: tepora-v3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
          - os: macos-latest
            bundle: dmg
          - os: ubuntu-22.04
            bundle: deb,appimage
          - os: ubuntu-24.04-arm
            bundle: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    defaults:
      run:
        working-directory: Tepora-v3
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Install pinned V3 SDK dependencies
        run: npm ci --prefix "${{ github.workspace }}/Tepora-v3" --ignore-scripts
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build and smoke dependencies
        if: runner.os == 'Linux'
        run: bash ci/install-linux-deps.sh
      # ci.yml owns PR/main source regression. Keep coverage for ARM64 and
      # standalone tag/manual builds, which do not have that regression run.
      - name: Standalone source regressions
        if: matrix.os == 'ubuntu-24.04-arm' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export RUST_TEST_THREADS=2; fi
          npm run build:core
          npm run test:rust
          npm run build:native
          npm run test:native
          node scripts/check.mjs
          if [ "$RUNNER_OS" = Windows ]; then
            node --import ./scripts/ci-diagnostics.mjs --test --test-concurrency=1 --test-timeout=120000
          else
            node --test
          fi
      - uses: actions/upload-artifact@v7
        if: always() && runner.os == 'Windows' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
        with:
          name: tepora-v3-test-diagnostics-${{ matrix.os }}
          path: Tepora-v3/validation/test-diagnostics/
          if-no-files-found: warn
      - run: node scripts/build-preview.mjs
      - run: npx tauri icon web/favicon.svg --output desktop/icons
      - run: node scripts/build-sidecar.mjs
      - run: ../node_modules/.bin/tauri build --bundles ${{ matrix.bundle }} -- --locked
        working-directory: Tepora-v3/desktop
      - name: Bundle RPM with prerelease package metadata
        if: runner.os == 'Linux'
        run: node scripts/bundle-rpm.mjs
      - name: Native launcher and permission regressions
        run: cargo test --release --locked --bin tepora-v3
        working-directory: Tepora-v3/desktop
      - name: Native installation and startup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ci/native-smoke.ps1
      - name: Native bundle startup (macOS)
        if: runner.os == 'macOS'
        run: bash ci/native-smoke.sh
      - name: Native installation and startup (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1440x960x24" dbus-run-session -- bash ci/native-smoke-linux.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tepora-v3-native-smoke-${{ matrix.os }}
          path: Tepora-v3/.qa-native/
          include-hidden-files: true
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: tepora-v3-${{ matrix.os }}
          if-no-files-found: error
          path: |
            Tepora-v3/desktop/target/release/bundle/**
            Tepora-v3/tepora-v3-preview.html
