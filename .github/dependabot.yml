version: 2
# Version and security updates both target main (the default branch, now carrying V3).
updates:
  - package-ecosystem: npm
    directory: /Tepora-v3
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "00:00"
      timezone: UTC
    open-pull-requests-limit: 1
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, automated]
  - package-ecosystem: cargo
    directories:
      - /Tepora-v3/desktop
      - /Tepora-v3/native-core
      - /Tepora-v3/native-service
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "00:00"
      timezone: UTC
    open-pull-requests-limit: 1
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, automated]
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "00:00"
      timezone: UTC
    open-pull-requests-limit: 1
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, automated]
